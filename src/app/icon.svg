<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Squircle Base with Subtle Border -->
  <rect x="1" y="1" width="30" height="30" rx="7.5" fill="url(#bgGrad)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.35" />

  <!-- Inner Ambient Glow Ring -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="url(#emeraldGrad)" stroke-width="0.75" stroke-opacity="0.2" stroke-dasharray="2 2" />

  <!-- Central Stylized Wheat & Dining Grain Emblem -->
  <!-- Central Stem -->
  <path d="M16 25V8" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" />

  <!-- Top Wheat Kernels -->
  <path d="M16 8C14.5 9 14.5 11 16 12C17.5 11 17.5 9 16 8Z" fill="url(#goldGrad)" />
  
  <!-- Upper Left Kernel -->
  <path d="M16 11C13.2 11.2 12 13 13.5 14.8C15 14.2 15.8 12.8 16 11Z" fill="url(#emeraldGrad)" />
  <!-- Upper Right Kernel -->
  <path d="M16 11C18.8 11.2 20 13 18.5 14.8C17 14.2 16.2 12.8 16 11Z" fill="url(#goldGrad)" />

  <!-- Middle Left Kernel -->
  <path d="M16 15C12.8 15.2 11.5 17.2 13.2 19.2C14.8 18.5 15.7 17 16 15Z" fill="url(#goldGrad)" />
  <!-- Middle Right Kernel -->
  <path d="M16 15C19.2 15.2 20.5 17.2 18.8 19.2C17.2 18.5 16.3 17 16 15Z" fill="url(#emeraldGrad)" />

  <!-- Base Arc / Mess Plate Accent -->
  <path d="M10 22.5C12 24.2 14 24.8 16 24.8C18 24.8 20 24.2 22 22.5" stroke="url(#emeraldGrad)" stroke-width="1.5" stroke-linecap="round" />
</svg>
