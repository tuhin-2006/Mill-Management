name: Weekly Report Scheduled Dispatch

on:
  schedule:
    # Runs every 5 minutes on GitHub Actions
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  trigger-report-cron:
    name: Check Schedule & Dispatch Reports
    runs-on: ubuntu-latest
    steps:
      - name: Invoke Next.js Weekly Report Cron Endpoint
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "https://mill-management-delta.vercel.app/api/cron/weekly-report?secret=mill_sec_9e21a4f08c3d7b6a12e5f804")
          echo "Endpoint response: $RESPONSE"
          if echo "$RESPONSE" | grep -q "404"; then
            echo "Falling back to secondary alias..."
            curl -s "https://mill-management-team-alpha-8934.vercel.app/api/cron/weekly-report?secret=mill_sec_9e21a4f08c3d7b6a12e5f804"
          fi
